<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="author" content="Md Afroj">
    <meta name="description" content="This is an Interactive Bulb made using HTML, CSS & JavaScript.">

    <title>Interactive Bulb</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="flexbox">
        <div class="container">
            <button class="btn turn-on-btn" onclick="
                document.getElementById('bulb').src='./img/bulb_on_pic.gif'
            ">
                Turn On
            </button>

            <img src="./img/bulb_off_pic.gif" alt="On-Off Bulb" class="bulb" id="bulb" width="115px">

            <button class="btn turn-off-btn" onclick="
                document.getElementById('bulb').src='./img/bulb_off_pic.gif'
            ">
                Turn Off
            </button>
        </div>
    </div>
</body>

</html>
